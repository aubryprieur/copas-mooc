test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Stockage objet hébergé en France (RGPD). Scaleway Object Storage, région Paris.
scaleway:
  service: S3
  endpoint: <%= ENV.fetch("S3_ENDPOINT", "https://s3.fr-par.scw.cloud") %>
  region: <%= ENV.fetch("S3_REGION", "fr-par") %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["S3_BUCKET"] %>
  force_path_style: true
  public: false

# Alternative : OVHcloud Object Storage (région Gravelines ou Strasbourg)
ovh:
  service: S3
  endpoint: <%= ENV.fetch("S3_ENDPOINT", "https://s3.gra.io.cloud.ovh.net") %>
  region: <%= ENV.fetch("S3_REGION", "gra") %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["S3_BUCKET"] %>
  force_path_style: true
  public: false
