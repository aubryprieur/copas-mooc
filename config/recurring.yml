production:
  # Indicateur 19 : relances d'inactivité et alertes de décrochage, chaque matin
  inactivity_reminders:
    class: InactivityReminderJob
    queue: default
    schedule: every day at 8:30am Europe/Paris
  # Indicateur 30 : questionnaire à froid à J+90
  cold_surveys:
    class: ColdSurveyJob
    queue: default
    schedule: every day at 9am Europe/Paris
  # Indicateur 9 : convocations à J-7 et rappels à J-1 des sessions sur site
  convocations:
    class: ConvocationJob
    queue: default
    schedule: every day at 7:30am Europe/Paris
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
