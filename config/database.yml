# PostgreSQL. En production (Scalingo), la connexion vient de DATABASE_URL / SCALINGO_POSTGRESQL_URL.
# Les tables de Solid Queue, Solid Cache et Solid Cable vivent dans la même base (une seule base à gérer).
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", nil) %>
  username: <%= ENV.fetch("DB_USERNAME", nil) %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>

development:
  <<: *default
  database: copas_academy_development

test:
  <<: *default
  database: copas_academy_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] || ENV["SCALINGO_POSTGRESQL_URL"] %>
